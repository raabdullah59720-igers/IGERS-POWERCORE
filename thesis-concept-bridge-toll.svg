<!-- car -->
<g transform="translate(135 85) rotate(27)"><path d="M-42 4L-31 -15L2 -18L23 -2L42 2L42 20L-42 20Z" fill="url(#cyan)" stroke="#d4fbff" stroke-width="2"/><path d="M-25 -13L0 -14L15 0L-32 0Z" fill="#123747" stroke="#8cecff"/><circle cx="-24" cy="21" r="9" fill="#08131c" stroke="#b3eff8" stroke-width="3"/><circle cx="26" cy="21" r="9" fill="#08131c" stroke="#b3eff8" stroke-width="3"/></g>
