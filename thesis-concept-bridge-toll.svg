<g fill="none" stroke-linecap="round" stroke-width="4"><path d="M385 345C500 402 657 400 760 334" stroke="#55ddff" stroke-dasharray="8 10"/><path d="M910 366C927 357 933 345 946 331" stroke="#8af3bf" stroke-dasharray="8 10"/></g>
<g fill="#c4f8ff" font-family="system-ui" font-size="13"><text x="455" y="410">CONDITIONED ENERGY</text><text x="852" y="482" text-anchor="middle">LOCAL LIGHTING / MONITORING</text></g>
<g transform="translate(860 490)" stroke="#8af3bf" stroke-width="3" fill="none"><path d="M-75 28V-6M-85 4L-75 -14 -65 4M-95 28H-55L-65 40H-85Z"/><path d="M0 28V-6M-10 4L0 -14 10 4M-20 28H20L10 40H-10Z"/><path d="M75 28V-6M65 4L75 -14 85 4M55 28H95L85 40H65Z"/></g>
