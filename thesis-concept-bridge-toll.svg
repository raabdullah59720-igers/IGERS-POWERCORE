<!-- conversion and storage -->
<g transform="translate(760 260)" filter="url(#glow)"><path d="M0 25L75 -12 152 25 77 63Z" fill="#163c4b" stroke="#77efff" stroke-width="2"/><path d="M0 25L77 63V138L0 100Z" fill="#102b38" stroke="#428fa2"/><path d="M77 63L152 25V100L77 138Z" fill="#214654" stroke="#58b6c8"/><rect x="39" y="35" width="75" height="30" rx="5" fill="#061720" stroke="#8af3bf"/><path d="M49 51L60 42 69 52 80 42 96 50" stroke="#8af3bf" stroke-width="3" fill="none"/><text x="77" y="158" fill="#c6f7ff" text-anchor="middle" font-size="13" font-family="system-ui">POWER CONDITIONER</text></g>
