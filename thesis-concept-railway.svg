<text x="922" y="410" font-size="11" fill="#9bdcff">WAYSIDE</text><text x="922" y="424" font-size="11" fill="#9bdcff">SENSOR</text>
<text x="67" y="574" font-size="10" fill="#7f9cab" letter-spacing="1.4">TRAIN MOVEMENT -> TRANSDUCER -> POWER CONDITIONING -> BUFFER STORAGE -> SENSOR LOAD</text></g>
</svg>