<g font-family="ui-monospace,Consolas,monospace" font-weight="700"><text x="64" y="61" font-size="18" fill="#8ceee4" letter-spacing="3">IGERS-BD-01 / RAILWAY ENERGY RECOVERY</text><text x="66" y="88" font-size="11" fill="#82a9ba" letter-spacing="2">CONCEPT VISUAL · NOT TO SCALE · NO LIVE TELEMETRY</text>
<text x="407" y="477" font-size="12" fill="#ffcf7f">TRACK-SIDE HARVESTER</text><path d="M465 465 465 486 412 486" fill="none" stroke="#ffcf7f" stroke-width="1.2" stroke-dasharray="3 4"/>
