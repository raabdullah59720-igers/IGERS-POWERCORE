<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Railway track energy recovery concept</title><desc id="desc">Isometric conceptual train and double rail track with sleepers, side-mounted vibration harvesters, cable, converter, storage battery, and a trackside sensor. Not a construction drawing.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#102b3a"/><stop offset="1" stop-color="#06131e"/></linearGradient>
 <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e3f6fa"/><stop offset=".45" stop-color="#8faab7"/><stop offset="1" stop-color="#425d6b"/></linearGradient>
 <linearGradient id="trainBody" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4db6c7"/><stop offset=".55" stop-color="#17657c"/><stop offset="1" stop-color="#103044"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe0a0"/><stop offset="1" stop-color="#b77932"/></linearGradient>
 <linearGradient id="storage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c6479"/><stop offset="1" stop-color="#102d3b"/></linearGradient>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#69a6bc" stroke-opacity=".11" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1100" height="620" rx="18" fill="url(#bg)"/><rect width="1100" height="620" rx="18" fill="url(#grid)"/>
