<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">IGERS bridge vibration and noise-mitigation concept</title><desc id="desc">Conceptual bridge support showing vibration monitoring, engineered isolation and optional low-power transduction feeding a conditioner. It does not imply that noise removal or vibration harvesting is validated or energy-positive.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2635"/><stop offset="1" stop-color="#061018"/></linearGradient>
 <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#526b78"/><stop offset="1" stop-color="#243b49"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cf4ff"/><stop offset="1" stop-color="#168fb7"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5ffd4"/><stop offset="1" stop-color="#228f79"/></linearGradient>
 <linearGradient id="pv" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43e7ff"/><stop offset="1" stop-color="#174a80"/></linearGradient>
 <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2a0"/><stop offset="1" stop-color="#ff8f58"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#3e8ca0" stroke-opacity=".22" stroke-width="1"/></pattern>
</defs>
<rect width="1100" height="620" rx="26" fill="url(#bg)"/><rect width="1100" height="620" rx="26" fill="url(#grid)"/>
<g opacity=".3" stroke="#347184" fill="none"><path d="M35 480L390 270 760 480 410 610Z"/><path d="M35 420L390 210 760 420 410 550Z"/><path d="M35 360L390 150 760 360 410 490Z"/></g>
<!-- elevated bridge slab -->
<g transform="translate(70 180)"><polygon points="0 95 365 -72 680 81 315 251" fill="#334d5a" stroke="#70d6e5" stroke-opacity=".8" stroke-width="2"/><polygon points="0 95 315 251 315 284 0 128" fill="#172d39"/><polygon points="315 251 680 81 680 114 315 284" fill="#263c49"/><path d="M45 96L315 230M137 54L407 189M229 12L499 147M322 -30L590 105" stroke="#d8eff4" stroke-opacity=".58" stroke-width="4" stroke-dasharray="19 17"/><path d="M110 128V280M310 215V370M520 118V267" stroke="#647f8b" stroke-width="18"/><path d="M95 279H128M294 369H327M503 266H536" stroke="#8af3bf" stroke-width="10"/><path d="M110 280V299M310 370V389M520 267V286" stroke="#55ddff" stroke-width="4" stroke-dasharray="4 5"/><text x="24" y="-22" fill="#9befff" font-family="system-ui" font-size="16" letter-spacing="1.5">BRIDGE / RAIL / ROAD STRUCTURE</text></g>
<!-- vibration waves -->
<g fill="none" stroke="#ffcb82" stroke-width="3"><path d="M392 130Q415 115 438 130T484 130T530 130"/><path d="M392 146Q415 131 438 146T484 146T530 146" opacity=".7"/><path d="M392 162Q415 147 438 162T484 162T530 162" opacity=".45"/></g><text x="455" y="105" text-anchor="middle" fill="#ffd9a0" font-family="system-ui" font-size="13">VIBRATION MONITORING</text>
<!-- isolation / sensor box -->
<g transform="translate(520 365)" filter="url(#glow)"><polygon points="0 24 70 -10 140 24 70 59" fill="#173d4b" stroke="#77efff" stroke-width="2"/><polygon points="0 24 70 59 70 104 0 69" fill="#102b38" stroke="#428fa2"/><polygon points="70 59 140 24 140 69 70 104" fill="#214654" stroke="#58b6c8"/><rect x="38" y="29" width="66" height="24" rx="4" fill="#071721" stroke="#8af3bf"/><circle cx="53" cy="41" r="4" fill="#8af3bf"/><path d="M63 41H92" stroke="#8af3bf" stroke-width="3"/><text x="70" y="128" fill="#c1f9ff" text-anchor="middle" font-family="system-ui" font-size="12">SENSOR / TRANSDUCER</text></g>
<!-- remote conditioning storage -->
<g transform="translate(800 260)"><polygon points="0 25 68 -8 136 25 68 59" fill="#163c4b" stroke="#77efff" stroke-width="2"/><polygon points="0 25 68 59 68 130 0 96" fill="#102b38" stroke="#428fa2"/><polygon points="68 59 136 25 136 96 68 130" fill="#214654" stroke="#58b6c8"/><path d="M27 53L45 43 58 54 70 42 89 51" stroke="#8af3bf" stroke-width="3" fill="none"/><text x="68" y="151" fill="#c1f9ff" text-anchor="middle" font-family="system-ui" font-size="12">CONDITIONING</text></g>
<g transform="translate(966 295)"><polygon points="0 18 42 0 84 18 42 40" fill="#224d47" stroke="#8af3bf" stroke-width="2"/><polygon points="0 18 42 40 42 116 0 94" fill="#17332f" stroke="#458d7a"/><polygon points="42 40 84 18 84 94 42 116" fill="#24574b" stroke="#65c6a5"/><path d="M20 38V64M10 51H30M55 58V83M45 70H65" stroke="#a5ffd4" stroke-width="4"/><text x="42" y="137" fill="#a5ffd4" text-anchor="middle" font-family="system-ui" font-size="12">STORAGE</text></g>
<path d="M445 415C470 435 500 425 520 410M660 412C704 420 755 403 800 364M936 334L965 322" fill="none" stroke="#55ddff" stroke-width="4" stroke-dasharray="8 10"/>
<g fill="#c4f8ff" font-family="system-ui" font-size="13"><text x="690" y="466">LOW-POWER MONITORING LOADS</text><text x="690" y="487" fill="#ffcf89">NOISE MITIGATION NEEDS A SEPARATE ACOUSTIC DESIGN</text></g>
<g><rect x="30" y="560" width="1040" height="36" rx="11" fill="#06131b" stroke="#285568"/><text x="550" y="583" fill="#8edfea" font-family="system-ui,sans-serif" font-size="12.5" text-anchor="middle" letter-spacing="1.7">CONCEPT STAGE · NOT TO SCALE · NO MEASURED OUTPUT OR FIELD VALIDATION IMPLIED</text></g>
