<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">IGERS roadside solar canopy and thermal-mitigation concept</title><desc id="desc">Conceptual canopy integrating photovoltaic generation, shade and passive heat-mitigation surfaces near a roadside shelter. Solar absorption by itself is not electricity generation; thermal design and PV yield require site-specific measurement.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2635"/><stop offset="1" stop-color="#061018"/></linearGradient>
 <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#526b78"/><stop offset="1" stop-color="#243b49"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cf4ff"/><stop offset="1" stop-color="#168fb7"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5ffd4"/><stop offset="1" stop-color="#228f79"/></linearGradient>
 <linearGradient id="pv" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43e7ff"/><stop offset="1" stop-color="#174a80"/></linearGradient>
 <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2a0"/><stop offset="1" stop-color="#ff8f58"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#3e8ca0" stroke-opacity=".22" stroke-width="1"/></pattern>
</defs>
<rect width="1100" height="620" rx="26" fill="url(#bg)"/><rect width="1100" height="620" rx="26" fill="url(#grid)"/>
<g opacity=".3" stroke="#347184" fill="none"><path d="M35 480L390 270 760 480 410 610Z"/><path d="M35 420L390 210 760 420 410 550Z"/><path d="M35 360L390 150 760 360 410 490Z"/></g>
<!-- sun and radiative paths -->
<g transform="translate(900 110)"><circle r="40" fill="url(#warm)" filter="url(#glow)"/><g stroke="#ffc77d" stroke-width="4" stroke-linecap="round"><path d="M0 -63V-81M0 63V81M-63 0H-81M63 0H81M-45 -45L-58 -58M45 45L58 58M45 -45L58 -58M-45 45L-58 58"/></g><text x="0" y="102" text-anchor="middle" fill="#ffd9a0" font-family="system-ui" font-size="14">SOLAR RADIATION</text></g>
<g fill="none" stroke="#ffb968" stroke-width="3" stroke-dasharray="7 10"><path d="M844 169L723 246"/><path d="M901 179L796 261"/><path d="M955 162L880 243"/></g>
<!-- canopy and PV -->
<g transform="translate(115 150)"><polygon points="0 120 260 0 500 117 240 244" fill="#112d42" stroke="#6de8ff" stroke-width="2"/><polygon points="24 120 260 11 475 117 240 227" fill="url(#pv)" stroke="#9cefff" stroke-width="2"/><g stroke="#b1f4ff" stroke-opacity=".8" fill="none" stroke-width="2"><path d="M78 95L293 202M126 73L341 180M174 51L389 158M222 28L437 135M91 136L327 26M143 162L379 51M195 187L430 78"/></g><path d="M88 160V310M240 244V355M418 145V280" stroke="#6d929f" stroke-width="12"/><path d="M88 310L240 355 418 280" stroke="#78939c" stroke-width="8" fill="none"/><text x="248" y="-17" text-anchor="middle" fill="#9befff" font-family="system-ui" font-size="17" letter-spacing="1.4">PV SHADE CANOPY</text></g>
<!-- shaded road / shelter -->
<g transform="translate(250 430)"><polygon points="0 20 260 -100 505 20 245 145" fill="#263f4d" stroke="#6aa2b0" stroke-width="2"/><path d="M40 20L245 123M110 -12L315 90M185 -45L388 55M262 -82L462 16" stroke="#d8eff4" stroke-opacity=".45" stroke-width="3" stroke-dasharray="16 13"/><g transform="translate(140 -130)"><path d="M0 0L110 -52 220 0 110 53Z" fill="#123448" stroke="#8af3bf" stroke-width="2"/><path d="M20 0L110 -43 199 0 110 43Z" fill="#0c2634" stroke="#55ddff"/><path d="M25 30V103M110 53V135M195 30V103" stroke="#789aa6" stroke-width="8"/><text x="110" y="-68" text-anchor="middle" fill="#c5f8ff" font-family="system-ui" font-size="12">BUS / ROAD SHELTER</text></g></g>
<!-- cooling airflow arrows and planting -->
<g fill="none" stroke="#8af3bf" stroke-width="4" stroke-linecap="round"><path d="M390 405C475 359 552 377 603 418" stroke-dasharray="7 9"/><path d="M577 401L604 418 573 426"/><path d="M480 465C546 433 594 443 628 470" stroke-dasharray="7 9"/><path d="M606 451L629 470 599 477"/></g>
<g transform="translate(690 433)" stroke="#8af3bf" stroke-width="3" fill="none"><path d="M0 26V-4M0 7L-16 -3M0 13L16 -1"/><circle cx="0" cy="-3" r="16" fill="#8af3bf" fill-opacity=".12"/><path d="M47 26V-4M47 7L31 -3M47 13L63 -1"/><circle cx="47" cy="-3" r="16" fill="#8af3bf" fill-opacity=".12"/></g>
<!-- storage -->
<g transform="translate(820 333)"><polygon points="0 22 52 0 104 22 52 48" fill="#224d47" stroke="#8af3bf" stroke-width="2"/><polygon points="0 22 52 48 52 138 0 112" fill="#17332f" stroke="#458d7a"/><polygon points="52 48 104 22 104 112 52 138" fill="#24574b" stroke="#65c6a5"/><path d="M24 45V79M13 62H35M71 68V102M60 85H82" stroke="#a5ffd4" stroke-width="4"/><text x="52" y="160" text-anchor="middle" fill="#a5ffd4" font-family="system-ui" font-size="13">BESS</text></g>
<g fill="#d0faff" font-family="system-ui" font-size="13"><text x="725" y="525" text-anchor="middle">SHADE + REFLECTIVE SURFACES</text><text x="725" y="545" text-anchor="middle" fill="#8af3bf">THERMAL MITIGATION + PV ELECTRICITY</text></g>
<path d="M495 305C590 307 702 315 820 360" fill="none" stroke="#55ddff" stroke-width="4" stroke-dasharray="8 10"/>
<g><rect x="30" y="560" width="1040" height="36" rx="11" fill="#06131b" stroke="#285568"/><text x="550" y="583" fill="#8edfea" font-family="system-ui,sans-serif" font-size="12.5" text-anchor="middle" letter-spacing="1.7">CONCEPT STAGE · NOT TO SCALE · NO MEASURED OUTPUT OR FIELD VALIDATION IMPLIED</text></g>
</svg>