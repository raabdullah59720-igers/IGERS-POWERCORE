<!-- Concept energy paths -->
<g fill="none" stroke-linecap="round" stroke-width="4"><path d="M370 190C420 214 450 250 488 330" stroke="#55ddff" stroke-dasharray="8 10"/><path d="M330 412C390 420 428 405 462 386" stroke="#55ddff" stroke-dasharray="8 10"/><path d="M790 264C755 282 720 316 674 342" stroke="#8af3bf" stroke-dasharray="8 10"/><path d="M675 415C729 422 758 413 797 401" stroke="#8af3bf" stroke-dasharray="8 10"/><path d="M915 331C947 295 978 250 980 184" stroke="#8af3bf" stroke-dasharray="8 10"/></g><g fill="#e5fcff" font-family="system-ui" font-size="13"><text x="405" y="250">RECOVER</text><text x="701" y="296">CONDITION</text><text x="741" y="455">STORE</text><text x="924" y="285" text-anchor="middle">USE</text></g>
<g><rect x="34" y="558" width="1032" height="36" rx="11" fill="#06131b" stroke="#285568"/><text x="550" y="581" fill="#8edfea" font-family="system-ui" font-size="13" text-anchor="middle" letter-spacing="2">CONCEPTUAL SYSTEM ARCHITECTURE · NOT TO SCALE · NO MEASURED PERFORMANCE IMPLIED</text></g>
