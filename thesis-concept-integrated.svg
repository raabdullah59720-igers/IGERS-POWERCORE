<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">IGERS-BD-01 integrated energy recovery ecosystem, conceptual 3D illustration</title><desc id="desc">Isometric road recovery, hydraulic recovery, solar canopy, power conditioning, battery storage, monitoring and local loads connected by conceptual energy paths. Not to scale.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2635"/><stop offset="1" stop-color="#061018"/></linearGradient>
 <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#526b78"/><stop offset="1" stop-color="#243b49"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cf4ff"/><stop offset="1" stop-color="#168fb7"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5ffd4"/><stop offset="1" stop-color="#228f79"/></linearGradient>
 <linearGradient id="pv" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43e7ff"/><stop offset="1" stop-color="#174a80"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#3e8ca0" stroke-opacity=".22" stroke-width="1"/></pattern>
</defs>
<rect width="1100" height="620" rx="26" fill="url(#bg)"/><rect width="1100" height="620" rx="26" fill="url(#grid)"/>
<g opacity=".35" stroke="#347184" fill="none"><path d="M40 500L390 300 730 500 380 610Z"/><path d="M40 440L390 240 730 440 380 550Z"/><path d="M40 380L390 180 730 380 380 490Z"/></g>
<!-- Road recovery -->
