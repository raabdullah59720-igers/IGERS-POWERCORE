<!-- Hydro channel -->
<g transform="translate(60 330)"><polygon points="0 50 135 -12 273 65 138 127" fill="#0e536c" stroke="#61d9ff"/><polygon points="0 50 138 127 138 153 0 76" fill="#103343"/><polygon points="138 127 273 65 273 91 138 153" fill="#174556"/><path d="M22 48L135 109 245 60" fill="none" stroke="#7cf2ff" stroke-width="4" stroke-dasharray="12 10"/><g transform="translate(170 54)"><ellipse cx="0" cy="0" rx="28" ry="17" fill="#17313c" stroke="#abf5ff" stroke-width="3"/><path d="M0 -15L7 -3 22 -6 10 4 17 18 0 9 -15 16 -8 2 -21 -7 -5 -5Z" fill="url(#cyan)" stroke="#b5f8ff" stroke-width="2"/><rect x="25" y="-15" width="46" height="30" rx="5" fill="#183746" stroke="#6de8ff"/><circle cx="48" cy="0" r="9" fill="none" stroke="#9cf6ff" stroke-width="3"/></g><text x="4" y="-30" fill="#9befff" font-size="17" font-family="system-ui" letter-spacing="2">HYDRAULIC</text></g>
<!-- PV canopy -->
<g transform="translate(570 70)"><path d="M25 113L220 22 380 112 185 205Z" fill="#102e45" stroke="#72eaff" stroke-width="2"/><path d="M45 113L220 32 360 112 185 193Z" fill="url(#pv)" stroke="#68e7ff" stroke-width="2"/><g stroke="#9cefff" stroke-opacity=".8" fill="none" stroke-width="2"><path d="M91 92L230 171M137 71L277 150M183 50L323 129M80 97L255 17M119 119L295 37M158 141L333 58"/></g><path d="M84 140L84 224M180 192L180 250M303 136L303 195" stroke="#7696a2" stroke-width="8"/><path d="M40 231L180 267 335 196" fill="none" stroke="#55ddff" stroke-opacity=".6" stroke-width="3"/><text x="72" y="-8" fill="#9befff" font-size="17" font-family="system-ui" letter-spacing="2">SOLAR SUPPORT</text></g>
