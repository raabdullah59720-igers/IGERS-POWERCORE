<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">IGERS remote infrastructure monitoring and resilient energy station concept</title><desc id="desc">High-level concept of a border-side infrastructure service station with solar-assisted energy, storage, a generic radar/sensor mast and a docking bay for inspection drones. The illustration is non-operational and contains no coverage, targeting or deployment instructions.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2635"/><stop offset="1" stop-color="#061018"/></linearGradient>
 <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#526b78"/><stop offset="1" stop-color="#243b49"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cf4ff"/><stop offset="1" stop-color="#168fb7"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5ffd4"/><stop offset="1" stop-color="#228f79"/></linearGradient>
 <linearGradient id="pv" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43e7ff"/><stop offset="1" stop-color="#174a80"/></linearGradient>
 <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2a0"/><stop offset="1" stop-color="#ff8f58"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
